[project]
name = "findex"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem0311", email = "181723914+Artem0311@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
