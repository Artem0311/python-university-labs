name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: findex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --locked

      - name: Check code with Ruff
        run: uv run --locked ruff check .

      - name: Check types with Pyright
        run: uv run --locked pyright

      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: findex/.benchmarks
          key: findex-benchmark-baseline-ubuntu-3.15-v1

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Check benchmark regressions
        run: |
          if [ -d .benchmarks ]; then
            uv run --locked pytest -q tests/test_benchmark.py --benchmark-only --benchmark-compare=0001 --benchmark-compare-fail=min:100%
          else
            uv run --locked pytest -q tests/test_benchmark.py --benchmark-only --benchmark-save=baseline
          fi
